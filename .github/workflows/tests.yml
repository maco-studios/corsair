name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  unit:
    name: Unit & feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: pcov

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - run: vendor/bin/pest --exclude-group=e2e --coverage --min=0 --coverage-clover=coverage.xml

      - name: Generate coverage badge
        run: php .github/scripts/coverage-badge.php coverage.xml .github/assets/img/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ':bar_chart: chore(ci): update coverage badge'
          file_pattern: .github/assets/img/badges/coverage.svg
