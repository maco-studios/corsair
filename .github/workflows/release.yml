name: Release

# Releases are cut as drafts (gh release create --draft), which fires
# release:created rather than release:published — so Tests and E2E both
# run against the draft before anyone sees it as real. This workflow
# watches both of those finish and only flips the draft to published once
# *both* report success for the same commit; if either is still pending
# or failed, it does nothing and waits to be triggered again by the other.

on:
  workflow_run:
    workflows: [Tests, E2E]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish the draft once both checks are green
    if: github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release if Tests and E2E have both succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          for workflow in tests.yml e2e.yml; do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --json headSha,conclusion,event \
              --jq "[.[] | select(.headSha == \"$HEAD_SHA\" and .event == \"release\")][0].conclusion")

            if [ "$conclusion" != "success" ]; then
              echo "$workflow has not succeeded yet for $HEAD_SHA (conclusion: ${conclusion:-pending}); waiting."
              exit 0
            fi
          done

          echo "Both Tests and E2E succeeded for $TAG — publishing."
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
