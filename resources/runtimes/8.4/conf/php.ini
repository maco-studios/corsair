memory_limit = 4G
max_execution_time = 1800
zlib.output_compression = 1
cgi.fix_pathinfo = 0
date.timezone = UTC

; Always send PHP's own error log to the container's stdout/stderr so
; `docker compose logs` shows it, regardless of the base image's defaults.
log_errors = On
error_log = /proc/self/fd/2

upload_max_filesize = 100M
post_max_size = 100M
max_input_vars = 10000

sendmail_path = "/usr/bin/msmtp -t"
