[www]
user = corsair
group = corsair
listen = /sock/php-fpm.sock
listen.owner = corsair
listen.group = corsair
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
clear_env = no
catch_workers_output = yes
access.log = /proc/self/fd/2
process.dumpable = yes
