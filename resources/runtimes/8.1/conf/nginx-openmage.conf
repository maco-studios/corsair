# OpenMage / Magento LTS (https://github.com/OpenMage/magento-lts). Document root is the project root.
user corsair;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    access_log /dev/stdout;

    upstream fastcgi_backend {
        server unix:/sock/php-fpm.sock;
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;
        autoindex off;
        charset UTF-8;

        # Store view selection. Leave both empty for the default store view.
        set $mage_run_code "";
        set $mage_run_type "store";

        add_header X-Content-Type-Options "nosniff" always;

        # TRACE and TRACK allow cross-site tracing.
        if ($request_method ~ ^TRAC[EK]$) {
            return 405;
        }

        # nginx uses the first regular expression that matches, so the order of every
        # location block below is significant.

        # Hidden files, plus the application code and configuration directories that
        # the classic Magento 1 layout keeps in the document root.
        location ~ /\. {
            deny all;
        }

        location ~ ^/(app|includes|lib|pkginfo|shell|var)/ {
            deny all;
        }

        location ~* \.(dist|flag|ip|lock|neon|sample|sh|yaml|yml)$ {
            deny all;
        }

        # ---- API routing ----
        location ~ ^/api/rest(/|$) {
            try_files $uri /api.php?type=rest&$args;
        }

        location ~ ^/api/(soap|v2_soap|xmlrpc|jsonrpc)(/|$) {
            try_files $uri /api.php$is_args$args;
        }

        location ~ ^/api(/|$) {
            try_files $uri /api.php$is_args$args;
        }
        # ---- End API routing ----

        # Customer uploads and purchased files. OpenMage serves them through PHP only.
        location ~ ^/media/(customer|customer_address|downloadable|custom_options)/ {
            deny all;
        }

        # A missing resized image goes to OpenMage, which creates it from the original.
        location ~ ^/media/.+/cache/ {
            try_files $uri /index.php$is_args$args;
            expires 1y;
            access_log off;
        }

        # These directories hold static files only. A missing file must give a
        # 404, and must not start a full application bootstrap.
        location ~ ^/(media|skin|js)/ {
            try_files $uri =404;
            expires 1y;
            access_log off;
        }

        # Only the entry points execute PHP.
        location ~ ^/(index|api|cron)\.php(/|$) {
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_pass fastcgi_backend;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param MAGE_RUN_CODE $mage_run_code;
            fastcgi_param MAGE_RUN_TYPE $mage_run_type;
            # Keep this value equal to max_execution_time in php.ini.
            fastcgi_read_timeout 1800s;
            fastcgi_connect_timeout 600s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_index index.php;
        }

        # Any other .php file is data, not code.
        location ~ \.php$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }
    }
}
