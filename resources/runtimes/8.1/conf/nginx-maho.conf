# MahoCommerce. Document root is public/.
# Rules follow https://mahocommerce.com/hosting/web-server/
user corsair;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    access_log /dev/stdout;

    upstream fastcgi_backend {
        server unix:/sock/php-fpm.sock;
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;
        autoindex off;
        charset UTF-8;

        # Store view selection. Leave both empty for the default store view.
        set $mage_run_code "";
        set $mage_run_type "store";

        add_header X-Content-Type-Options "nosniff" always;

        # TRACE and TRACK allow cross-site tracing.
        if ($request_method ~ ^TRAC[EK]$) {
            return 405;
        }

        # nginx uses the first regular expression that matches, so the order of every
        # location block below is significant.

        # Hidden files. /.well-known/ is a registered path prefix, and /.thumbs/ holds
        # the thumbnails of the admin media browser.
        location ~ /\.(?!well-known/|thumbs/) {
            deny all;
        }

        # File types that disclose the installation. The exempt names below are
        # generated by PHP, so no file exists for them, but access control runs
        # before the rewrite and would still deny them.
        # .md is not listed: a page URL with a .md suffix is the markdown version
        # that PHP generates for AI agents.
        location ~* (?<!/robots)(?<!/llms)(?<!/llms-full)\.txt$ {
            deny all;
        }

        location ~* (?<!/manifest)(?<!/docs)(?<!/mcp)(?<!/server-card)(?<!/ai-catalog)\.json$ {
            deny all;
        }

        location ~* \.(dist|flag|ip|lock|neon|sample|sh|yaml|yml)$ {
            deny all;
        }

        # ---- API routing ----
        location ~ ^/api/rest/v2(/|$) {
            try_files $uri /rest.php$is_args$args;
        }

        location ~ ^/api/rest(/|$) {
            try_files $uri /api.php?type=rest&$args;
        }

        location ~ ^/api/(soap|v2_soap|xmlrpc|jsonrpc)(/|$) {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/api(/|$) {
            try_files $uri /rest.php$is_args$args;
        }
        # ---- End API routing ----

        # Customer uploads and purchased files. Maho serves them through PHP only.
        location ~ ^/media/(customer|customer_address|downloadable|custom_options)/ {
            deny all;
        }

        # Feeds and sitemaps are regenerated in place, so a proxy must not keep
        # an old copy.
        location ~ ^/media/.*\.(xml|csv|json|jsonl|gz)$ {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
            access_log off;
        }

        # A missing resized image goes to Maho, which creates it from the original.
        location ~ ^/media/.+/cache/[0-9a-f]{12}/[0-9]+/ {
            try_files $uri /index.php$is_args$args;
            expires 1y;
            access_log off;
        }

        # These three directories hold static files only. A missing file must give a
        # 404, and must not start a full Maho bootstrap.
        location ~ ^/(media|skin|js)/ {
            try_files $uri =404;
            expires 1y;
            access_log off;
        }

        # Only the entry points execute PHP.
        location ~ ^/(index|rest|api)\.php(/|$) {
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_pass fastcgi_backend;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param MAGE_RUN_CODE $mage_run_code;
            fastcgi_param MAGE_RUN_TYPE $mage_run_type;
            # Keep this value equal to max_execution_time in php.ini.
            fastcgi_read_timeout 1800s;
            fastcgi_connect_timeout 600s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_index index.php;
        }

        # Any other .php file is data, not code.
        location ~ \.php$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }
    }
}
